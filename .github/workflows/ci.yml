name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_agent
          POSTGRES_PASSWORD: ai_agent
          POSTGRES_DB: ai_agent_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_agent -d ai_agent_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend

      - name: Set up Python
        run: uv python install 3.12
        working-directory: backend

      - name: Install dependencies
        run: uv sync --frozen --group dev
        working-directory: backend

      - name: Run tests
        run: uv run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ai_agent:ai_agent@127.0.0.1:5432/ai_agent_platform_test
          RETRIEVAL_INDEX_ENABLED: "false"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image
        run: docker build -f backend/Dockerfile backend
