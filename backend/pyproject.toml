[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "fastapi>=0.141.1",
    "openai>=3.3.1",
    "pinecone>=9.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
